[package]
name = "bg-tok-tiktok"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
experimental-companion = []

[dependencies]
async-trait = "0.1"
bg-tok = { path = "../bg-tok" }
bytes = "1"
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
