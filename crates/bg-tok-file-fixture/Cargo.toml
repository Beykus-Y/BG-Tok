[package]
name = "bg-tok-file-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bg-tok = { path = "../bg-tok" }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bg-tok-range = { path = "../bg-tok-range" }
